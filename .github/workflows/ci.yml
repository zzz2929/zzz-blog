name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # Remote image HTTP cache (.cache/http): avoids re-downloading ~100
      # remote images on every CI build. Keyed by source tree hash with a
      # loose restore key so most entries survive content changes.
      - name: Cache remote images
        uses: actions/cache@v4
        with:
          path: .cache
          key: image-cache-${{ hashFiles('src/**', 'astro.config.mjs') }}
          restore-keys: |
            image-cache-

      # Astro's built-in image cache (node_modules/.astro): persists optimized
      # thumbnails so the generate stage reuses all 182 images instead of
      # re-running sharp. Both caches together make CI builds warm (~15s astro).
      - name: Cache Astro image cache
        uses: actions/cache@v4
        with:
          path: node_modules/.astro
          key: astro-image-cache-${{ hashFiles('src/**', 'astro.config.mjs') }}
          restore-keys: |
            astro-image-cache-

      - name: 构建验证
        run: pnpm build

      # 部署到 Cloudflare Workers（wrangler deploy）。
      # 背景：Cloudflare 自身的远程构建机访问 imgbed.904002.xyz 图床会快速失败
      # （Failed to parse image reference），无法完成构建；GitHub Actions 环境
      # 可达且有 .cache / node_modules/.astro 双缓存，因此改为在 Actions 里
      # 构建并上传产物。仅 push 到 main 时部署，PR 只做构建验证。
      # 部署目标：本仓库是 Astro Cloudflare adapter 的 Workers 布局（dist/client
      # 静态资产 + dist/server Worker 入口）。在仓库根运行 `wrangler deploy`，
      # 使用根 wrangler.jsonc（main 指向 dist/server/entry.mjs，assets 指向
      # dist/client）。不要在 dist/server 目录部署：adapter 生成的
      # dist/server/wrangler.json 的 configPath 是构建机绝对路径，在 CI 上会
      # 导致 wrangler 同时发现仓库根配置与 dist/server 配置且基路径不一致，
      # 报 "Found both a user configuration file at wrangler.json and a deploy
      # configuration file at ../../.wrangler/deploy/config.json"。
      # 前置：仓库 Secrets 需配置 CLOUDFLARE_API_TOKEN（Cloudflare Workers: Edit
      # 权限）与 CLOUDFLARE_ACCOUNT_ID；Cloudflare 控制台需断开 Workers 项目
      # zzz-blog 的 Git 集成连接（避免远程构建再次失败）。
      - name: 部署到 Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          packageManager: pnpm
